historic_red_brick_urban:
  name: 历史红砖城市建筑
  visual_cues:
  - 红砖立面
  - 石材基座
  - 凸窗/弧形窗
  - 阳台
  - 细部线脚
  - 成熟行道树
  paper_translation:
  - 暖红/赭色纹理卡纸砖墙
  - 灰米色厚卡纸石材基座
  - 分层窗框
  - 压纹阳台栏杆
  - 纸雕树冠
  material_priority:
  - textured cardstock
  - embossed paper
  - layered cut paper
  avoid:
  - 地中海白墙化
  - 童话城堡化
  - 统一欧式模板
